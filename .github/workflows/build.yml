name: build

# 三段式编译：yoga.lib -> Ling.lib -> ScreenCapture.exe，外加 Go 写的 OCR 插件。
# 工具集固定 v143（VS2022），windows-latest 镜像里正好有；v145 只支持 Win11，别改回去。

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 把 MSBuild 放进 PATH，并设置 MSBUILD_EXE_PATH；build.ps1 会优先用它
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build ScreenCapture (yoga -> Ling -> exe)
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\build.ps1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      - name: Build OCR plugin
        working-directory: plugin
        shell: powershell
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          # -unsafeptr=false：win.go 里 GlobalLock 返回的 uintptr 直接转 *byte 是 Win32 的标准用法，
          # vet 的 unsafeptr 规则会误报（exit 1 会让整个 job 挂掉），这里只关这一条检查
          go vet -unsafeptr=false ./...
          go test ./...
          go build -trimpath -ldflags "-s -w -H windowsgui" -o ImageReader.exe .

      - name: Collect artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item src\Src\x64\Release\ScreenCapture.exe dist\ -Force
          Copy-Item plugin\ImageReader.exe               dist\ -Force
          Copy-Item plugin\config.example.json           dist\ -Force
          Get-ChildItem dist | ForEach-Object {
            "{0,-22} {1,10:N0} bytes  {2}" -f $_.Name, $_.Length,
              (Get-FileHash $_.FullName -Algorithm SHA256).Hash.Substring(0, 32)
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCapture-win64-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      # 打 tag 时顺手发一个 Release，省得再去点下载
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ScreenCapture.exe
            dist/ImageReader.exe
            dist/config.example.json
          generate_release_notes: true
